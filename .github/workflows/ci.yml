name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # release.yml runs the same checks on the native libraries of a kernels release.
  workflow_call:
    inputs:
      kernels_version:
        description: "Release tag of ap-base/apbase-fortran-kernels whose native libraries are tested"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Same Ubuntu release as the development machine (GEOS/PROJ/glibc versions).
  SYSTEM_PACKAGES: >-
    ca-certificates curl git gcc g++ gfortran pkg-config zstd jq
    libopenblas-dev libgeos-dev libproj-dev

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: System libraries
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --release --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: tests (linux)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: System libraries
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
      - uses: actions/checkout@v4
      - name: Native library from the kernels release
        if: inputs.kernels_version != ''
        shell: bash
        env:
          KERNELS_TOKEN: ${{ secrets.APBASE_KERNELS_TOKEN }}
        run: .github/scripts/fetch_native_library.sh "${{ inputs.kernels_version }}" x86_64-unknown-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit, integration and doc tests
        run: cargo test --release
      - name: Examples
        run: |
          cargo run --release --example quick_use
          cargo run --release --example cokriging

  test-macos:
    name: tests (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - name: System libraries (Homebrew)
        run: |
          brew install gcc openblas geos proj
          command -v pkg-config || brew install pkgconf
      - uses: actions/checkout@v4
      - name: Native library from the kernels release
        if: inputs.kernels_version != ''
        env:
          KERNELS_TOKEN: ${{ secrets.APBASE_KERNELS_TOKEN }}
        run: .github/scripts/fetch_native_library.sh "${{ inputs.kernels_version }}" ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit, integration and doc tests
        run: cargo test --release
      - name: Examples
        run: |
          cargo run --release --example quick_use
          cargo run --release --example cokriging

  test-windows:
    name: tests (x86_64-pc-windows-gnu)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PKG_CONFIG: pkgconf
    steps:
      - name: System libraries (MSYS2 MINGW64)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-openblas
            mingw-w64-x86_64-geos mingw-w64-x86_64-proj mingw-w64-x86_64-pkgconf
      - name: MINGW64 first on PATH (linker, pkg-config and runtime DLLs)
        shell: pwsh
        run: Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/checkout@v4
      - name: Native library from the kernels release
        if: inputs.kernels_version != ''
        env:
          KERNELS_TOKEN: ${{ secrets.APBASE_KERNELS_TOKEN }}
        run: .github/scripts/fetch_native_library.sh "${{ inputs.kernels_version }}" x86_64-pc-windows-gnu
      - name: GNU Rust toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Unit, integration and doc tests
        run: cargo test --release
      - name: Examples
        run: |
          cargo run --release --example quick_use
          cargo run --release --example cokriging

  msrv:
    name: minimum Rust (1.85)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: System libraries
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets
