name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, equal to the version in Cargo.toml (e.g. 0.1.2)"
        type: string
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Same Ubuntu release as ci.yml (GEOS/PROJ/glibc versions).
  SYSTEM_PACKAGES: >-
    ca-certificates curl git gcc g++ gfortran pkg-config zstd
    libopenblas-dev libgeos-dev libproj-dev

jobs:
  release:
    name: test, package, release
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: System libraries
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version matches Cargo.toml
        env:
          VERSION: ${{ inputs.version }}
        run: |
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$crate_version" != "$VERSION" ]; then
            echo "::error::version input '$VERSION' differs from Cargo.toml '$crate_version'" >&2
            exit 1
          fi
      - name: Tests
        run: cargo test --release
      - name: Package
        run: cargo package
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: apbase ${{ inputs.version }}
          generate_release_notes: true
          files: target/package/apbase-${{ inputs.version }}.crate
