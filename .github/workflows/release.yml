name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, equal to the version in Cargo.toml (e.g. 0.1.2)"
        type: string
        required: true
      kernels_version:
        description: "Release tag of ap-base/apbase-fortran-kernels with the native libraries"
        type: string
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Same Ubuntu release as ci.yml (GEOS/PROJ/glibc versions).
  SYSTEM_PACKAGES: >-
    ca-certificates curl git gcc g++ gfortran pkg-config zstd
    libopenblas-dev libgeos-dev libproj-dev jq
  TARGETS: >-
    x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-gnu

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version matches Cargo.toml and CITATION.cff
        env:
          VERSION: ${{ inputs.version }}
        run: |
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          citation_version="$(sed -n 's/^version: "\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' CITATION.cff | head -n 1)"
          if [ "$crate_version" != "$VERSION" ] || [ "$citation_version" != "$VERSION" ]; then
            echo "::error::version input '$VERSION' differs from Cargo.toml '$crate_version' or CITATION.cff '$citation_version'" >&2
            exit 1
          fi

  ci:
    name: CI on the kernels release
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      kernels_version: ${{ inputs.kernels_version }}
    secrets: inherit

  release:
    name: package, release
    needs: ci
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: System libraries
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native libraries from the kernels release
        shell: bash
        env:
          KERNELS_TOKEN: ${{ secrets.APBASE_KERNELS_TOKEN }}
        run: .github/scripts/fetch_native_library.sh "${{ inputs.kernels_version }}" $TARGETS
      - name: Package
        run: cargo package --allow-dirty
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: apbase ${{ inputs.version }}
          generate_release_notes: true
          files: target/package/apbase-${{ inputs.version }}.crate
