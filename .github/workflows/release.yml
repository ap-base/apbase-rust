name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, equal to the version in Cargo.toml (e.g. 0.1.2)"
        type: string
        required: true
      kernels_version:
        description: "Release tag of ap-base/apbase-fortran-kernels with the native library"
        type: string
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Same Ubuntu release as ci.yml (GEOS/PROJ/glibc versions).
  SYSTEM_PACKAGES: >-
    ca-certificates curl git gcc g++ gfortran pkg-config zstd
    libopenblas-dev libgeos-dev libproj-dev jq

jobs:
  release:
    name: test, package, release
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: System libraries
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version matches Cargo.toml
        env:
          VERSION: ${{ inputs.version }}
        run: |
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$crate_version" != "$VERSION" ]; then
            echo "::error::version input '$VERSION' differs from Cargo.toml '$crate_version'" >&2
            exit 1
          fi
      - name: Native library from the kernels release
        shell: bash
        env:
          KERNELS_TOKEN: ${{ secrets.APBASE_KERNELS_TOKEN }}
          KERNELS_VERSION: ${{ inputs.kernels_version }}
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/ap-base/apbase-fortran-kernels
          auth=(-H "Authorization: Bearer ${KERNELS_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          asset=libapbase_native-x86_64-unknown-linux-gnu.a
          url="$(curl -fsSL "${auth[@]}" "${api}/releases/tags/${KERNELS_VERSION}" \
            | jq -r --arg name "${asset}" '.assets[] | select(.name == $name) | .url')"
          if [ -z "${url}" ]; then
            echo "::error::kernels release ${KERNELS_VERSION} has no ${asset}" >&2
            exit 1
          fi
          curl -fsSL "${auth[@]}" -H "Accept: application/octet-stream" \
            -o native/x86_64-unknown-linux-gnu/libapbase_native.a "${url}"
      - name: Tests
        run: cargo test --release
      - name: Package
        run: cargo package --allow-dirty
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: apbase ${{ inputs.version }}
          generate_release_notes: true
          files: target/package/apbase-${{ inputs.version }}.crate
